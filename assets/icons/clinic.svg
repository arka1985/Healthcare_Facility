<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="wc-blur-clinic" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="pinkWashClinic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fbcfe8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="skyClinic" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Watercolor wash background -->
  <path d="M 48,8 C 76,5 94,24 92,52 C 90,76 74,94 48,92 C 22,90 6,72 8,46 C 10,20 24,10 48,8 Z" 
        fill="url(#pinkWashClinic)" filter="url(#wc-blur-clinic)"/>
  <circle cx="26" cy="28" r="14" fill="#e0f2fe" opacity="0.7" filter="url(#wc-blur-clinic)"/>
  <circle cx="78" cy="74" r="12" fill="#bae6fd" opacity="0.6" filter="url(#wc-blur-clinic)"/>
  <circle cx="82" cy="22" r="3" fill="#f472b6" opacity="0.6"/>
  <circle cx="18" cy="72" r="4" fill="#38bdf8" opacity="0.5"/>

  <!-- Stethoscope Motif -->
  <path d="M 32,28 C 32,46 38,58 50,58 C 62,58 68,46 68,28" 
        fill="none" stroke="#0369a1" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Stethoscope earpieces -->
  <circle cx="32" cy="26" r="4" fill="#f472b6" stroke="#0369a1" stroke-width="2"/>
  <circle cx="68" cy="26" r="4" fill="#f472b6" stroke="#0369a1" stroke-width="2"/>
  
  <!-- Stethoscope tube and disc -->
  <path d="M 50,58 L 50,68 C 50,76 58,78 62,78 L 64,78" 
        fill="none" stroke="#0369a1" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="70" cy="78" r="8" fill="#ffffff" stroke="#db2777" stroke-width="3"/>
  <circle cx="70" cy="78" r="4" fill="#f472b6"/>
  
  <!-- Heart cross badge -->
  <circle cx="50" cy="42" r="7" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
  <path d="M 50,38 L 50,46 M 46,42 L 54,42" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>
</svg>
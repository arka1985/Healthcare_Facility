<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <filter id="wc-blur-pin" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="pinRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <radialGradient id="pinShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground watercolor shadow -->
  <ellipse cx="50" cy="108" rx="28" ry="8" fill="url(#pinShadow)" filter="url(#wc-blur-pin)"/>

  <!-- Watercolor wash halo -->
  <circle cx="50" cy="46" r="40" fill="#bae6fd" opacity="0.6" filter="url(#wc-blur-pin)"/>
  <circle cx="70" cy="30" r="14" fill="#fbcfe8" opacity="0.6"/>

  <!-- Pin Shape -->
  <path d="M 50,14 C 30,14 14,30 14,50 C 14,74 50,105 50,105 C 50,105 86,74 86,50 C 86,30 70,14 50,14 Z" 
        fill="url(#pinRose)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
        
  <!-- Inner White Circle -->
  <circle cx="50" cy="48" r="18" fill="#ffffff"/>
  
  <!-- Hospital Cross inside pin -->
  <rect x="47" y="38" width="6" height="20" rx="2" fill="#e11d48"/>
  <rect x="40" y="45" width="20" height="6" rx="2" fill="#e11d48"/>
</svg>
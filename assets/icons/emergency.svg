<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="wc-blur-emerg" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="roseEmerg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="skyEmerg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Watercolor wash background -->
  <path d="M 52,6 C 80,8 96,28 92,54 C 88,80 72,94 46,92 C 20,90 4,74 8,48 C 12,22 24,4 52,6 Z" 
        fill="url(#roseEmerg)" filter="url(#wc-blur-emerg)"/>
  <circle cx="20" cy="24" r="12" fill="url(#skyEmerg)" opacity="0.8" filter="url(#wc-blur-emerg)"/>
  <circle cx="80" cy="76" r="10" fill="#bae6fd" opacity="0.6"/>

  <!-- Emergency Shield / Heart -->
  <path d="M 50,22 C 64,22 75,32 75,46 C 75,64 50,78 50,78 C 50,78 25,64 25,46 C 25,32 36,22 50,22 Z" 
        fill="#ffffff" stroke="#e11d48" stroke-width="3" stroke-linejoin="round"/>

  <!-- Pulse / ECG Wave -->
  <path d="M 28,48 L 40,48 L 45,34 L 51,62 L 56,42 L 60,52 L 64,48 L 72,48" 
        fill="none" stroke="#e11d48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Beacons -->
  <circle cx="50" cy="18" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
</svg>
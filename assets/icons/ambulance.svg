<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="wc-blur-amb" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="skyAmb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pinkAmb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Watercolor wash background -->
  <path d="M 48,8 C 76,6 94,24 92,52 C 90,78 74,92 48,94 C 22,96 6,78 8,50 C 10,22 24,10 48,8 Z" 
        fill="url(#skyAmb)" opacity="0.8" filter="url(#wc-blur-amb)"/>
  <circle cx="78" cy="74" r="14" fill="#fbcfe8" opacity="0.7"/>

  <!-- Ambulance Body -->
  <path d="M 18,44 L 56,44 L 64,52 L 82,52 C 84,52 86,54 86,58 L 86,72 L 18,72 Z" 
        fill="#ffffff" stroke="#0369a1" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Cabin Window -->
  <path d="M 64,54 L 80,54 L 80,62 L 62,62 Z" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="36" y="52" width="14" height="10" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Siren Light -->
  <path d="M 40,38 L 46,38 L 45,44 L 41,44 Z" fill="url(#pinkAmb)" stroke="#e11d48" stroke-width="1.5"/>
  <circle cx="43" cy="36" r="2" fill="#f43f5e"/>

  <!-- Red/Pink Medical Cross -->
  <rect x="25" y="54" width="4" height="12" rx="1" fill="#e11d48"/>
  <rect x="21" y="58" width="12" height="4" rx="1" fill="#e11d48"/>

  <!-- Wheels -->
  <circle cx="32" cy="72" r="7" fill="#334155" stroke="#ffffff" stroke-width="2"/>
  <circle cx="32" cy="72" r="3" fill="#94a3b8"/>
  
  <circle cx="72" cy="72" r="7" fill="#334155" stroke="#ffffff" stroke-width="2"/>
  <circle cx="72" cy="72" r="3" fill="#94a3b8"/>
</svg>
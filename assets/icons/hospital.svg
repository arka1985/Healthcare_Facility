<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="wc-blur-hosp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="skyWashHosp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="pinkHosp" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="splat1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Watercolor wash background -->
  <path d="M 50,6 C 72,4 92,20 94,44 C 96,68 82,92 58,94 C 34,96 8,84 6,58 C 4,32 28,8 50,6 Z" 
        fill="url(#skyWashHosp)" filter="url(#wc-blur-hosp)"/>
  <circle cx="76" cy="24" r="14" fill="url(#pinkHosp)" opacity="0.6" filter="url(#wc-blur-hosp)"/>
  <circle cx="22" cy="74" r="10" fill="#fbcfe8" opacity="0.5" filter="url(#wc-blur-hosp)"/>
  <circle cx="84" cy="70" r="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="16" cy="30" r="3" fill="#f472b6" opacity="0.6"/>

  <!-- Hospital Building Base -->
  <rect x="25" y="32" width="50" height="46" rx="6" fill="#ffffff" opacity="0.95" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Roof Accent -->
  <path d="M 22,34 L 50,18 L 78,34 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 46,16 L 54,16 L 54,22 L 46,22 Z" fill="#f472b6"/>

  <!-- Watercolor Medical Cross -->
  <rect x="44" y="38" width="12" height="24" rx="3" fill="url(#pinkHosp)" stroke="#db2777" stroke-width="1.5"/>
  <rect x="38" y="44" width="24" height="12" rx="3" fill="url(#pinkHosp)" stroke="#db2777" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="2.5" fill="#ffffff"/>

  <!-- Windows & Door -->
  <rect x="31" y="62" width="8" height="10" rx="2" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="61" y="62" width="8" height="10" rx="2" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.5"/>
  <path d="M 45,78 L 45,68 C 45,66 55,66 55,68 L 55,78 Z" fill="#fbcfe8" stroke="#db2777" stroke-width="1.5"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="wc-blur-ayush" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="mintSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="pinkLotus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- Watercolor wash background -->
  <path d="M 50,6 C 74,4 92,22 94,48 C 96,74 80,94 54,94 C 28,94 6,78 6,52 C 6,26 26,8 50,6 Z" 
        fill="url(#mintSky)" opacity="0.85" filter="url(#wc-blur-ayush)"/>
  <circle cx="24" cy="74" r="14" fill="#fbcfe8" opacity="0.7"/>

  <!-- Ayurveda / Lotus / Leaf -->
  <!-- Central Leaf -->
  <path d="M 50,18 C 34,34 36,62 50,76 C 64,62 66,34 50,18 Z" 
        fill="#ffffff" stroke="#059669" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Leaf vein -->
  <path d="M 50,22 L 50,72 M 50,38 L 42,32 M 50,48 L 40,42 M 50,58 L 42,54 M 50,38 L 58,32 M 50,48 L 60,42 M 50,58 L 58,54" 
        stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Lotus Petal -->
  <path d="M 38,40 C 24,46 22,66 38,76 C 42,66 42,52 38,40 Z" 
        fill="url(#pinkLotus)" opacity="0.9" stroke="#db2777" stroke-width="1.5"/>
  <!-- Right Lotus Petal -->
  <path d="M 62,40 C 76,46 78,66 62,76 C 58,66 58,52 62,40 Z" 
        fill="url(#pinkLotus)" opacity="0.9" stroke="#db2777" stroke-width="1.5"/>
        
  <!-- Base water waves -->
  <path d="M 28,82 C 38,78 44,84 50,82 C 56,80 62,84 72,82" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
</svg>
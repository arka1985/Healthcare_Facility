<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="wc-blur-bb" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="skyWashBB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Watercolor wash background -->
  <path d="M 50,8 C 76,6 94,22 92,50 C 90,78 76,92 48,94 C 20,96 6,80 8,50 C 10,20 24,10 50,8 Z" 
        fill="url(#skyWashBB)" filter="url(#wc-blur-bb)"/>
  <circle cx="78" cy="26" r="12" fill="#fbcfe8" opacity="0.7"/>

  <!-- Blood droplet -->
  <path d="M 50,20 C 50,20 72,48 72,64 C 72,76.15 62.15,86 50,86 C 37.85,86 28,76.15 28,64 C 28,48 50,20 50,20 Z" 
        fill="url(#dropGrad)" stroke="#9f1239" stroke-width="2.5" stroke-linejoin="round"/>
        
  <!-- Droplet shine -->
  <path d="M 37,56 C 35,62 36,70 41,74" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- White medical cross inside droplet -->
  <rect x="47" y="52" width="6" height="18" rx="2" fill="#ffffff"/>
  <rect x="41" y="58" width="18" height="6" rx="2" fill="#ffffff"/>
</svg>
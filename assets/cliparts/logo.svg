<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <filter id="wc-blur-logo" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="skyGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pinkGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Left icon badge -->
  <g transform="translate(10, 8)">
    <!-- Watercolor wash behind icon -->
    <path d="M 32,4 C 50,2 62,14 62,32 C 62,50 48,62 30,62 C 12,62 2,48 4,30 C 6,12 16,4 32,4 Z" 
          fill="#e0f2fe" opacity="0.9" filter="url(#wc-blur-logo)"/>
    <circle cx="48" cy="18" r="14" fill="#fbcfe8" opacity="0.75" filter="url(#wc-blur-logo)"/>

    <!-- Lotus & Cross -->
    <!-- Lotus Petals -->
    <path d="M 32,18 C 22,26 20,42 32,50 C 44,42 42,26 32,18 Z" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 22,28 C 12,34 14,48 26,48 C 28,40 26,32 22,28 Z" fill="#fbcfe8" opacity="0.9" stroke="#f472b6" stroke-width="1.5"/>
    <path d="M 42,28 C 52,34 50,48 38,48 C 36,40 38,32 42,28 Z" fill="#bae6fd" opacity="0.9" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Red/Pink Heart Cross in center -->
    <rect x="30" y="28" width="4" height="14" rx="2" fill="url(#pinkGradLogo)"/>
    <rect x="25" y="33" width="14" height="4" rx="2" fill="url(#pinkGradLogo)"/>
    <circle cx="32" cy="35" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="82" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    Aarogya<tspan fill="#f43f5e">Map</tspan>
  </text>
  <text x="84" y="56" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0284c7" letter-spacing="1.5">
    INDIA HEALTHCARE DIRECTORY
  </text>
  
  <!-- Subtle watercolor accent dot -->
  <circle cx="304" cy="34" r="5" fill="#f472b6" opacity="0.8"/>
  <circle cx="310" cy="40" r="3" fill="#38bdf8" opacity="0.8"/>
</svg>
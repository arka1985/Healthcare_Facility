<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" preserveAspectRatio="none">
  <defs>
    <filter id="wc-wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fbcfe8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="#f8fafc"/>

  <!-- Fluid watercolor blobs -->
  <path d="M -50,50 Q 200,-40 450,80 T 900,40 Q 1100,100 1250,20 L 1250,380 Q 950,420 700,340 T 200,380 Z" 
        fill="url(#skyGrad)" filter="url(#wc-wash)"/>

  <path d="M 1250,80 Q 950,20 650,140 T 150,90 Q -50,180 -80,320 L -80,450 Q 300,380 650,440 T 1250,350 Z" 
        fill="url(#pinkGrad)" filter="url(#wc-wash)"/>

  <!-- Subtle watercolor splatter dots -->
  <circle cx="180" cy="90" r="14" fill="#38bdf8" opacity="0.3"/>
  <circle cx="210" cy="115" r="7" fill="#f472b6" opacity="0.4"/>
  <circle cx="230" cy="80" r="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="980" cy="120" r="18" fill="#fb7185" opacity="0.25"/>
  <circle cx="1020" cy="150" r="8" fill="#38bdf8" opacity="0.35"/>
  <circle cx="1040" cy="110" r="5" fill="#f472b6" opacity="0.4"/>
</svg>